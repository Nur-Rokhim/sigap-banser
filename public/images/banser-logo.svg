<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E9B4A" />
      <stop offset="100%" stop-color="#085B2B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EB0F" />
      <stop offset="50%" stop-color="#C9A24A" />
      <stop offset="100%" stop-color="#936D1F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Pentagon / Shield -->
  <polygon points="100,8 185,42 165,155 100,192 35,155 15,42" 
           fill="url(#goldGrad)" 
           stroke="#240608" 
           stroke-width="3" 
           filter="url(#shadow)"/>

  <!-- Inner Shield -->
  <polygon points="100,16 177,47 159,148 100,182 41,148 23,47" 
           fill="url(#shieldGrad)" 
           stroke="#C9A24A" 
           stroke-width="2"/>

  <!-- Red Center Accent Band -->
  <path d="M 40,95 Q 100,115 160,95 L 158,110 Q 100,130 42,110 Z" fill="#E5232B" opacity="0.9"/>

  <!-- Star of BANSER -->
  <g transform="translate(100, 72) scale(0.9)">
    <!-- Central Large Star -->
    <polygon points="0,-36 9,-11 35,-11 14,5 22,30 0,16 -22,30 -14,5 -35,-11 -9,-11" 
             fill="url(#goldGrad)" 
             stroke="#240608" 
             stroke-width="1.5" 
             filter="url(#shadow)"/>
  </g>

  <!-- Small Stars Arch (4 stars left, 4 stars right) -->
  <circle cx="55" cy="55" r="4" fill="#F5EB0F" />
  <circle cx="70" cy="40" r="4.5" fill="#F5EB0F" />
  <circle cx="90" cy="33" r="5" fill="#F5EB0F" />
  <circle cx="110" cy="33" r="5" fill="#F5EB0F" />
  <circle cx="130" cy="40" r="4.5" fill="#F5EB0F" />
  <circle cx="145" cy="55" r="4" fill="#F5EB0F" />

  <!-- Ribbon BANSER Banner -->
  <g transform="translate(100, 142)">
    <path d="M -65,-12 L 65,-12 L 75,10 L 60,18 L 0,22 L -60,18 L -75,10 Z" 
          fill="#5A0E14" 
          stroke="#C9A24A" 
          stroke-width="2" 
          filter="url(#shadow)"/>
    <text x="0" y="7" 
          text-anchor="middle" 
          fill="#F5EB0F" 
          font-family="'Archivo', Arial, sans-serif" 
          font-weight="900" 
          font-size="16" 
          letter-spacing="2">BANSER</text>
  </g>

  <!-- SATKORCAB BLITAR Arch/Text -->
  <text x="100" y="174" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="'Archivo', Arial, sans-serif" 
        font-weight="800" 
        font-size="9" 
        letter-spacing="1.5">SATKORCAB BLITAR</text>
</svg>
