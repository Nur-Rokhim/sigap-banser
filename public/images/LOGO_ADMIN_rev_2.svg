<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="45%" stop-color="#C9A24A" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A0E14" />
      <stop offset="100%" stop-color="#240608" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Emblem: Badge with Quill/Pen & Document -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield/Emblem -->
    <circle cx="50" cy="50" r="46" fill="url(#maroonGrad)" stroke="url(#goldGradient)" stroke-width="3.5" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="39" fill="none" stroke="#F5EB0F" stroke-width="1.2" stroke-dasharray="3 2"/>

    <!-- Document Symbol -->
    <rect x="34" y="27" width="28" height="38" rx="3" fill="#FFFFFF" stroke="#C9A24A" stroke-width="1.5" />
    <line x1="39" y1="35" x2="57" y2="35" stroke="#5A0E14" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="39" y1="41" x2="57" y2="41" stroke="#5A0E14" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="39" y1="47" x2="52" y2="47" stroke="#5A0E14" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="53" cy="56" r="3.5" fill="#E5232B"/>

    <!-- Quill / Golden Pen Cross -->
    <path d="M 58,26 L 66,22 C 67,28 64,36 56,46 L 52,43 C 58,35 59,29 58,26 Z" fill="url(#goldGradient)"/>
    <polygon points="52,43 50,49 55,47" fill="#C9A24A"/>

    <!-- Golden Stars on Badge -->
    <polygon points="50,14 51.5,18 55,18 52,20 53,24 50,21.5 47,24 48,20 45,18 48.5,18" fill="#F5EB0F"/>
  </g>

  <!-- Typography / Text block -->
  <g transform="translate(118, 0)">
    <!-- Main Title: ADMINPERS -->
    <text x="0" y="52" 
          font-family="'Archivo', sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="2.5" 
          fill="url(#goldGradient)" 
          filter="url(#glow)">ADMINPERS</text>

    <!-- Subtitle 1: SATKORCAB BANSER -->
    <text x="2" y="76" 
          font-family="'Archivo', sans-serif" 
          font-size="14.5" 
          font-weight="800" 
          letter-spacing="3" 
          fill="#FFFFFF">SATKORCAB BANSER</text>

    <!-- Subtitle 2: KABUPATEN BLITAR -->
    <text x="2" y="96" 
          font-family="'Public Sans', sans-serif" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="2.5" 
          fill="#F5EB0F">KABUPATEN BLITAR</text>

    <!-- Tri-color miniature accent underline -->
    <rect x="2" y="104" width="35" height="3" fill="#E5232B" rx="1.5"/>
    <rect x="40" y="104" width="35" height="3" fill="#F5EB0F" rx="1.5"/>
    <rect x="78" y="104" width="35" height="3" fill="#0E9B4A" rx="1.5"/>
  </g>
</svg>
